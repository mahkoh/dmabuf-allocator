name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo chmod o+rw /dev/udmabuf
      - run: sudo ln -sf /dev/udmabuf /dev/dri/renderD128
      - run: cargo test

  generated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git submodule update --init --depth 1 -- ./tests/generated-tests/vectors
      - run: cargo run --release -p generated-tests

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build -p dmabuf-allocator --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dmabuf-allocator") | .rust_version')
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build -p dmabuf-allocator

  codegen:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - run: pacman -Syu --noconfirm base-devel git rustup
      - uses: actions/checkout@v5
      - uses: ./.github/actions/codegen
      - run: git diff --exit-code
